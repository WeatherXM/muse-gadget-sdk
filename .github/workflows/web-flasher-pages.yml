# The web flasher on GitHub Pages from the firmware committed under
# web-flasher/firmware/ (the signed WG1200 dual-boot image), without building
# the whole board matrix: esp32.yml does that, and its deploy also carries
# the committed firmware. Boards in boards.json with no committed firmware
# are left off this page rather than shown with nothing to flash.
name: Web flasher (committed firmware)

on:
  push:
    branches: [main]
    paths:
      - "web-flasher/**"
      - ".github/workflows/web-flasher-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble web flasher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Add page and committed firmware
        run: |
          mkdir -p site/firmware
          cp -R web-flasher/firmware/* site/firmware/
          boards=$(jq -r '.[].board' web-flasher/boards.json | tr -d '\r')
          keep=()
          for board in $boards; do
            [ -f "site/firmware/$board/manifest.json" ] && keep+=("$board")
          done
          [ ${#keep[@]} -gt 0 ] || { echo "::error::no committed firmware"; exit 1; }
          jq --argjson keep "$(printf '%s\n' "${keep[@]}" | jq -R . | jq -s .)" \
            '[.[] | select(.board as $b | $keep | index($b))]' \
            web-flasher/boards.json > site/boards.json
          cp web-flasher/index.html web-flasher/*.js site/
          echo "{\"commit\": \"$GITHUB_SHA\"}" > site/build.json
          echo "Boards on the page: ${keep[*]}"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy web flasher
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
